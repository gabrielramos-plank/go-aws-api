version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose # unclosed HTTP response bodies
    - errorlint # errors compared with == instead of errors.Is/As
    - gocritic # common bugs and style issues
    - gosec # security problems
    - misspell
    - noctx # HTTP requests / DB calls without a context
    - unconvert # unnecessary type conversions

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - go-aws-api
